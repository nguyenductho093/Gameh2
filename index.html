<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đấu Trí Con Số - Mind Duel</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #818cf8;
            margin-top: 0;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 25px;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Setup Screen */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Game Screen */
        .status-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-card {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #334155;
        }

        .status-card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .status-card .value {
            font-size: 18px;
            font-weight: bold;
            color: #818cf8;
        }

        .log-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            height: 180px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            padding: 8px 12px;
            border-radius: 6px;
            background-color: #1e293b;
        }

        .log-item.bot {
            border-left: 4px solid var(--danger);
        }

        .log-item.player {
            border-left: 4px solid var(--accent);
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: #334155;
            font-size: 14px;
            text-align: left;
            padding: 10px 15px;
        }

        .action-btn:hover {
            background-color: #475569;
        }

        .guess-section {
            display: flex;
            gap: 10px;
        }

        .guess-section input {
            flex: 1;
        }

        .guess-section button {
            width: 120px;
            background-color: var(--accent);
        }

        .guess-section button:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Đấu Trí Con Số</h1>
    <p class="subtitle">Suy luận thông minh - Đoán nhanh chiến thắng</p>

    <!-- MÀN HÌNH 1: CÀI ĐẶT -->
    <div id="setup-screen" class="screen active">
        <div class="form-group">
            <label for="range-select">Phạm vi con số:</label>
            <select id="range-select">
                <option value="50">1 đến 50 (Dễ)</option>
                <option value="100" selected>1 đến 100 (Chuẩn)</option>
                <option value="200">1 đến 200 (Khó)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="player-secret">Số bí mật của bạn (1 đến phạm vi chọn):</label>
            <input type="number" id="player-secret" placeholder="Ví dụ: 37" min="1">
        </div>
        <button onclick="startGame()">Bắt đầu trận đấu</button>
    </div>

    <!-- MÀN HÌNH 2: TRÒ CHƠI -->
    <div id="game-screen" class="screen">
        <div class="status-panel">
            <div class="status-card">
                <h3>Lượt hiện tại</h3>
                <div class="value" id="turn-display">1</div>
            </div>
            <div class="status-card">
                <h3>Số của bạn</h3>
                <div class="value" id="player-secret-display">--</div>
            </div>
        </div>

        <div class="log-box" id="log-box">
            <div class="log-item">Trận đấu bắt đầu! Hãy chọn kỹ năng hoặc đoán số của Bot.</div>
        </div>

        <div class="actions-grid">
            <button class="action-btn" onclick="useSkill('A')"><strong>[Kỹ năng A]</strong> Kiểm tra lớn/nhỏ hơn nửa khoảng</button>
            <button class="action-btn" onclick="useSkill('B')"><strong>[Kỹ năng B]</strong> Kiểm tra Chẵn / Lẻ</button>
            <button class="action-btn" onclick="useSkill('C')"><strong>[Kỹ năng C]</strong> Kiểm tra chia hết cho 5 hoặc 3</button>
            <button class="action-btn" onclick="useSkill('D')"><strong>[Kỹ năng D]</strong> Khoảng cách gần đúng (Chia dư cho 10)</button>
        </div>

        <div class="guess-section">
            <input type="number" id="player-guess" placeholder="Đoán số của Bot...">
            <button onclick="makeGuess()">Đoán Ngay</button>
        </div>
    </div>
</div>

<script>
    let maxRange = 100;
    let playerSecret = 0;
    let botSecret = 0;
    let turn = 1;
    let botMin = 1;
    let botMax = 100;

    function startGame() {
        maxRange = parseInt(document.getElementById('range-select').value);
        const inputVal = parseInt(document.getElementById('player-secret').value);

        if (isNaN(inputVal) || inputVal < 1 || inputVal > maxRange) {
            alert(`Vui lòng nhập số hợp lệ từ 1 đến ${maxRange}!`);
            return;
        }

        playerSecret = inputVal;
        botSecret = Math.floor(Math.random() * maxRange) + 1;
        turn = 1;
        botMin = 1;
        botMax = maxRange;

        document.getElementById('player-secret-display').textContent = playerSecret;
        document.getElementById('turn-display').textContent = turn;
        document.getElementById('log-box.innerHTML') = '';
        appendLog('system', `Trận đấu bắt đầu! Bot đã chọn một số từ 1 đến ${maxRange}.`);

        // Chuyển màn hình
        document.getElementById('setup-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
    }

    function appendLog(sender, text) {
        const logBox = document.getElementById('log-box');
        const item = document.createElement('div');
        item.className = `log-item ${sender}`;
        item.innerHTML = text;
        logBox.appendChild(item);
        logBox.scrollTop = logBox.scrollHeight;
    }

    function useSkill(type) {
        let clue = "";
        const mid = Math.floor(maxRange / 2);

        switch(type) {
            case 'A':
                if (botSecret > mid) clue = `Số của Bot **lớn hơn** ${mid}.`;
                else clue = `Số của Bot **nhỏ hơn hoặc bằng** ${mid}.`;
                break;
            case 'B':
                if (botSecret % 2 === 0) clue = `Số của Bot là **số chẵn**.`;
                else clue = `Số của Bot là **số lẻ**.`;
                break;
            case 'C':
                if (botSecret % 5 === 0) clue = `Số của Bot **chia hết cho 5**.`;
                else if (botSecret % 3 === 0) clue = `Số của Bot **chia hết cho 3** (nhưng không chia hết cho 5).`;
                else clue = `Số của Bot **không chia hết cho cả 3 và 5**.`;
                break;
            case 'D':
                const remainder = botSecret % 10;
                clue = `Số của Bot chia 10 dư **${remainder}**.`;
                break;
        }

        appendLog('player', `Bạn dùng Kỹ năng ${type} ➔ ${clue}`);
        botTurn();
    }

    function makeGuess() {
        const guessVal = parseInt(document.getElementById('player-guess').value);
        if (isNaN(guessVal)) {
            alert('Vui lòng nhập một con số để đoán!');
            return;
        }

        if (guessVal === botSecret) {
            appendLog('player', `🎉 Chúc mừng! Bạn đã đoán đúng số của Bot là <strong>${botSecret}</strong> và CHIẾN THẮNG!`);
            endGame();
        } else if (guessVal < botSecret) {
            appendLog('player', `Bạn đoán ${guessVal}: ❌ Sai! Số của Bot **lớn hơn** số này.`);
            botTurn();
        } else {
            appendLog('player', `Bạn đoán ${guessVal}: ❌ Sai! Số của Bot **nhỏ hơn** số này.`);
            botTurn();
        }
        document.getElementById('player-guess').value = '';
    }

    function botTurn() {
        // Bot suy luận thông minh bằng thuật toán chặt nhị phân (Binary Search) kết hợp ngẫu nhiên
        const botGuess = Math.floor((botMin + botMax) / 2);
        
        appendLog('bot', `🤖 Bot suy luận và đoán số của bạn là: <strong>${botGuess}</strong>`);

        if (botGuess === playerSecret) {
            appendLog('bot', `💥 Rất tiếc! Bot đã đoán trúng số của bạn (${playerSecret}) trước. BẠN ĐÃ THUA!`);
            endGame();
            return;
        } else if (botGuess < playerSecret) {
            appendLog('bot', `🤖 Bot nhận xét: Số của bạn lớn hơn ${botGuess}. (Bot thu hẹp khoảng tìm kiếm)`);
            botMin = Math.max(botMin, botGuess + 1);
        } else {
            appendLog('bot', `🤖 Bot nhận xét: Số của bạn nhỏ hơn ${botGuess}. (Bot thu hẹp khoảng tìm kiếm)`);
            botMax = Math.min(botMax, botGuess - 1);
        }

        turn++;
        document.getElementById('turn-display').textContent = turn;
    }

    function endGame() {
        setTimeout(() => {
            alert("Trận đấu kết thúc! Nhấn OK để chơi lại.");
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('setup-screen').classList.add('active');
        }, 500);
    }
</script>

</body>
</html>
