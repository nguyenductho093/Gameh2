<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Gia Đình</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
        .container { width: 100%; max-width: 500px; background: white; display: flex; flex-direction: column; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .hidden { display: none !important; }
        
        /* Giao diện Đăng nhập */
        #auth-form { padding: 40px 20px; display: flex; flex-direction: column; gap: 15px; text-align: center; }
        #auth-form input, #auth-form button { padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        #auth-form button { background: #0084ff; color: white; border: none; cursor: pointer; font-weight: bold; }

        /* Giao diện Chat */
        #chat-window { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        #header { background: #0084ff; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        #logout-btn { background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; }
        
        /* Bong bóng tin nhắn */
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 20px; word-wrap: break-word; font-size: 15px; }
        .msg-me { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 5px; }
        .msg-other { background: #e4e6eb; color: black; align-self: flex-start; border-bottom-left-radius: 5px; }
        .sender-name { font-size: 11px; color: #65676b; margin-bottom: 2px; display: block; }
        
        #chat-input-area { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
        #chat-input { flex-grow: 1; padding: 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; }
        #send-btn { background: #0084ff; color: white; border: none; padding: 10px 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="auth-form">
            <h2>🏡 Chat Gia Đình</h2>
            <input type="email" id="email" placeholder="Email của bạn (Ví dụ: bo@gmail.com)" required>
            <input type="password" id="password" placeholder="Mật khẩu" required>
            <button id="login-btn">Đăng Nhập</button>
        </div>

        <div id="chat-window" class="hidden">
            <div id="header">
                <span id="user-display">Đang tải...</span>
                <button id="logout-btn">Đăng xuất</button>
            </div>
            <ul id="messages"></ul>
            <form id="chat-input-area">
                <input id="chat-input" autocomplete="off" placeholder="Nhập tin nhắn..." required />
                <button id="send-btn" type="submit">Gửi</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cấu hình Firebase cá nhân của bạn đã được gộp vào đây
        const firebaseConfig = {
            apiKey: "AIzaSyD8paYPgRUYh0CfHhlkDFwTpRoNq_BFZbg",
            authDomain: "messenger-f5c90.firebaseapp.com",
            projectId: "messenger-f5c90",
            storageBucket: "messenger-f5c90.firebasestorage.app",
            messagingSenderId: "876963590642",
            appId: "1:876963590642:web:c87c47762f1c4facba3b6b"
        };

        // Khởi tạo các dịch vụ Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Khai báo các thành phần giao diện
        const authForm = document.getElementById('auth-form');
        const chatWindow = document.getElementById('chat-window');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messagesList = document.getElementById('messages');
        const chatInput = document.getElementById('chat-input');
        
        let currentUser = null;

        // 1. XỬ LÝ ĐĂNG NHẬP
        document.getElementById('login-btn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
                .catch(err => alert("Lỗi đăng nhập: " + err.message));
        });

        // 2. XỬ LÝ ĐĂNG XUẤT
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // 3. THEO DÕI TRẠNG THÁI TÀI KHOẢN (ĐÃ ĐĂNG NHẬP HAY CHƯA)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authForm.classList.add('hidden');
                chatWindow.classList.remove('hidden');
                document.getElementById('user-display').textContent = "Xin chào: " + user.email;
                taiLichSuChat(); // Tải tin nhắn khi đăng nhập thành công
            } else {
                currentUser = null;
                authForm.classList.remove('hidden');
                chatWindow.classList.add('hidden');
                messagesList.innerHTML = '';
            }
        });

        // 4. GỬI TIN NHẮN LÊN FIREBASE
        document.getElementById('chat-input-area').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (chatInput.value.trim() !== '') {
                await addDoc(collection(db, "tin_nhan"), {
                    sender: currentUser.email,
                    text: chatInput.value,
                    createdAt: new Date()
                });
                chatInput.value = '';
            }
        });

        // 5. LẮNG NGHE TIN NHẮN THỜI GIAN THỰC (REAL-TIME)
        function taiLichSuChat() {
            const q = query(collection(db, "tin_nhan"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                messagesList.innerHTML = ''; // Xóa màn hình cũ để cập nhật mới
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const li = document.createElement('li');
                    
                    // Phân biệt tin của mình (màu xanh) hay người khác (màu xám)
                    const laTinCuaToi = data.sender === currentUser.email;
                    li.className = `msg ${laTinCuaToi ? 'msg-me' : 'msg-other'}`;
                    
                    // Hiển thị tên người gửi nếu là người khác
                    li.innerHTML = `${!laTinCuaToi ? `<span class="sender-name">${data.sender}</span>` : ''} ${data.text}`;
                    
                    messagesList.appendChild(li);
                });
                messagesList.scrollTop = messagesList.scrollHeight; // Tự cuộn xuống dưới cùng
            });
        }
    </script>
</body>
</html>
